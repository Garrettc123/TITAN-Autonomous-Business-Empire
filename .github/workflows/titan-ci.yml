name: ⚡ TITAN — Autonomous Business CI/CD

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'  # autonomous sweep every 4 hours
  workflow_dispatch:

jobs:
  verify:
    name: ✅ Verify TITAN Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn httpx
      - run: python -c "from titan.core import TITANCore; print('TITAN core OK')" 2>/dev/null || echo 'Core not imported yet'
      - run: pytest tests/ -v 2>/dev/null || echo 'No tests yet'

  revenue-check:
    name: 💰 Revenue Status Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Stripe MRR
        run: |
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            python scripts/revenue_check.py 2>/dev/null || echo 'Revenue script pending'
          else
            echo '⚠️ STRIPE_SECRET_KEY not set yet'
          fi
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

  deploy:
    name: 🚀 Deploy TITAN
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        run: |
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            npm install -g @railway/cli
            railway up --detach
          else
            echo '⚠️ RAILWAY_TOKEN not configured'
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
